<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Mulla Wedding Stories</title>
    <style>
        :root {
            --primary: #c91818;
            --bg: #111;
            --text: #fff;
            --panel: #222;
            --border: #333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        .upload-card {
            background: var(--panel);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 40px;
        }
        .file-input {
            margin-bottom: 20px;
            width: 100%;
        }
        input[type="file"] {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            border: 1px dashed #555;
            width: 100%;
            box-sizing: border-box;
            color: #fff;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }
        button:hover {
            opacity: 0.8;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .media-item {
            position: relative;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 1;
        }
        .media-item img, .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(200, 0, 0, 0.8);
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Dashboard / Manage Portfolio</h1>

    <div class="upload-card">
        <h3>Upload New Media</h3>
        <p style="color:#aaa; font-size:14px; margin-bottom: 20px;">Upload an image (.jpg, .png) or a video (.mp4). It will automatically appear in your portfolio.</p>
        <div class="file-input">
            <input type="file" id="mediaInput" accept="image/*,video/*">
        </div>
        <button id="uploadBtn">Upload to Website</button>
        <div id="status"></div>
    </div>

    <h3>Current Portfolio Media</h3>
    <div class="gallery" id="gallery">
        <!-- Media items will load here -->
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // Your Supabase Keys
    const supabaseUrl = 'https://qisjhkxiwkvnnurcvjcg.supabase.co';
    const supabaseKey = 'sb_publishable_g1jR6_Js9DjMsfiJmO7L8Q_kx_cFGfR';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const uploadBtn = document.getElementById('uploadBtn');
    const mediaInput = document.getElementById('mediaInput');
    const statusEl = document.getElementById('status');
    const galleryEl = document.getElementById('gallery');

    // 1. Upload Logic
    uploadBtn.addEventListener('click', async () => {
        const file = mediaInput.files[0];
        if (!file) {
            statusEl.innerText = "Please select a file first.";
            statusEl.style.color = "red";
            return;
        }

        uploadBtn.disabled = true;
        statusEl.innerText = "Uploading to Cloud Storage...";
        statusEl.style.color = "#aaa";

        try {
            // Generate unique filename
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            const filePath = `${fileName}`;

            // Upload to Storage
            const { error: uploadError } = await supabase.storage.from('media').upload(filePath, file);
            
            if (uploadError) throw uploadError;

            // Get Public URL
            const { data } = supabase.storage.from('media').getPublicUrl(filePath);
            const publicURL = data.publicUrl;

            statusEl.innerText = "Saving to Database...";

            // Determine type
            const type = file.type.startsWith('video/') ? 'video' : 'image';

            // Insert into Database
            const { error: dbError } = await supabase.from('portfolio').insert([{ type: type, url: publicURL }]);
            
            if (dbError) throw dbError;

            statusEl.innerText = "Successfully uploaded! It is now live on your website.";
            statusEl.style.color = "#4CAF50";
            mediaInput.value = ''; // clear input
            
            // Reload gallery
            loadGallery();

        } catch (error) {
            console.error(error);
            statusEl.innerText = `Error: ${error.message}`;
            statusEl.style.color = "red";
        } finally {
            uploadBtn.disabled = false;
        }
    });

    // 2. Load Gallery Logic
    async function loadGallery() {
        const { data, error } = await supabase.from('portfolio').select('*').order('created_at', { ascending: false });
        
        if (error) {
            console.error('Error fetching gallery:', error);
            return;
        }

        galleryEl.innerHTML = '';

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'media-item';

            if (item.type === 'video') {
                div.innerHTML = `<video src="${item.url}" autoplay loop muted></video>`;
            } else {
                div.innerHTML = `<img src="${item.url}" alt="Media">`;
            }

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = 'Delete';
            delBtn.onclick = () => deleteMedia(item.id, item.url);

            div.appendChild(delBtn);
            galleryEl.appendChild(div);
        });
    }

    // 3. Delete Logic
    async function deleteMedia(id, url) {
        if (!confirm('Are you sure you want to delete this from your website?')) return;
        
        try {
            // Delete from DB
            await supabase.from('portfolio').delete().eq('id', id);
            
            // Extract filename from URL and delete from storage
            const urlParts = url.split('/');
            const fileName = urlParts[urlParts.length - 1];
            await supabase.storage.from('media').remove([fileName]);

            // Reload gallery
            loadGallery();
        } catch(error) {
            console.error("Error deleting:", error);
            alert("Error deleting media.");
        }
    }

    // Load on start
    loadGallery();
</script>
</body>
</html>
