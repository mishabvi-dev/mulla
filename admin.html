<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Mulla Wedding Stories</title>
    <style>
        :root { --primary: #c91818; --bg: #111; --text: #fff; --panel: #222; --border: #333; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
        .card { background: var(--panel); padding: 30px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 40px; }
        .field { margin-bottom: 20px; width: 100%; }
        input { background: #000; padding: 12px; border-radius: 4px; border: 1px solid #555; width: 100%; box-sizing: border-box; color: #fff; font-size: 16px; margin-bottom: 15px; }
        input[type="file"] { border: 1px dashed #555; }
        button { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; transition: opacity 0.3s; width: 100%; }
        button.small { padding: 8px 16px; font-size: 12px; width: auto; background: #333; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; text-align: center; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .media-item { position: relative; background: #000; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; aspect-ratio: 1; }
        .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(200, 0, 0, 0.8); padding: 5px 10px; font-size: 12px; width: auto; }
        #dashboardSection { display: none; }
        #loginSection { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- LOGIN SECTION -->
    <div id="loginSection" class="card">
        <h2 style="text-align: center; margin-bottom: 30px;">Admin Login</h2>
        <input type="email" id="loginEmail" placeholder="Email Address">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Secure Login</button>
        <div id="loginStatus" style="margin-top: 15px; color: red; text-align: center; font-size: 14px;"></div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection">
        <h1>Dashboard <button id="logoutBtn" class="small">Logout</button></h1>

        <div class="card">
            <h3>Upload New Media</h3>
            <p style="color:#aaa; font-size:14px; margin-bottom: 20px;">Upload an image or video, and choose where it should appear on the website.</p>
            
            <div class="field">
                <label style="display:block; margin-bottom:5px; color:#ddd; font-size:14px;">Destination Section:</label>
                <select id="uploadSection" style="background:#000; color:#fff; padding:12px; width:100%; border:1px solid #555; border-radius:4px; font-size:16px;">
                    <option value="portfolio">Portfolio Grid (Images & Videos)</option>
                    <option value="reels">Reels Section (Videos Only)</option>
                </select>
            </div>

            <!-- IG LINK (Hidden by default) -->
            <div class="field" id="igLinkContainer" style="display:none; margin-top: 15px;">
                <label style="display:block; margin-bottom:5px; color:#ddd; font-size:14px;">Instagram Link (Optional):</label>
                <input type="url" id="igLinkInput" placeholder="https://www.instagram.com/reel/..." style="margin-bottom:0;">
            </div>

            <div class="field" style="margin-top: 20px;">
                <input type="file" id="mediaInput" accept="image/*,video/*">
            </div>
            <button id="uploadBtn" style="width:auto;">Upload to Website</button>
            <div id="status"></div>
        </div>

        <h3>Current Website Media</h3>
        <div class="gallery" id="gallery"></div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://qisjhkxiwkvnnurcvjcg.supabase.co';
    const supabaseKey = 'sb_publishable_g1jR6_Js9DjMsfiJmO7L8Q_kx_cFGfR';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginStatus = document.getElementById('loginStatus');

    const uploadSectionDropdown = document.getElementById('uploadSection');
    const igLinkContainer = document.getElementById('igLinkContainer');
    const igLinkInput = document.getElementById('igLinkInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const mediaInput = document.getElementById('mediaInput');
    const statusEl = document.getElementById('status');
    const galleryEl = document.getElementById('gallery');

    // Toggle IG link input visibility
    uploadSectionDropdown.addEventListener('change', () => {
        if (uploadSectionDropdown.value === 'reels') {
            igLinkContainer.style.display = 'block';
        } else {
            igLinkContainer.style.display = 'none';
        }
    });

    // ── AUTHENTICATION ──
    async function checkUser() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            loadGallery();
        } else {
            loginSection.style.display = 'block';
            dashboardSection.style.display = 'none';
        }
    }
    checkUser();

    loginBtn.addEventListener('click', async () => {
        loginBtn.disabled = true;
        loginStatus.innerText = "Authenticating...";
        
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
            loginStatus.innerText = error.message;
            loginBtn.disabled = false;
        } else {
            loginStatus.innerText = "";
            loginBtn.disabled = false;
            checkUser();
        }
    });

    logoutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut();
        checkUser();
    });

    // ── UPLOAD LOGIC ──
    uploadBtn.addEventListener('click', async () => {
        const file = mediaInput.files[0];
        if (!file) { statusEl.innerText = "Please select a file first."; statusEl.style.color = "red"; return; }

        const section = uploadSectionDropdown.value;
        const isVideo = file.type.startsWith('video/');

        if (section === 'reels' && !isVideo) {
            statusEl.innerText = "Error: The Reels section only accepts video files!";
            statusEl.style.color = "red";
            return;
        }

        uploadBtn.disabled = true;
        statusEl.innerText = "Uploading to Cloud Storage...";
        statusEl.style.color = "#aaa";

        try {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            
            const { error: uploadError } = await supabase.storage.from('media').upload(fileName, file);
            if (uploadError) throw uploadError;

            const { data } = supabase.storage.from('media').getPublicUrl(fileName);
            statusEl.innerText = "Saving to Database...";
            
            let typeStr = 'portfolio_image';
            if (section === 'reels') typeStr = 'reels_video';
            else if (isVideo) typeStr = 'portfolio_video';

            // Append IG Link to the URL hash if provided (No database schema change needed!)
            let finalUrl = data.publicUrl;
            const igLink = igLinkInput.value.trim();
            if (section === 'reels' && igLink) {
                finalUrl = `${data.publicUrl}#ig=${encodeURIComponent(igLink)}`;
            }

            const { error: dbError } = await supabase.from('portfolio').insert([{ type: typeStr, url: finalUrl }]);
            if (dbError) throw dbError;

            statusEl.innerText = "Successfully uploaded to " + section + "!";
            statusEl.style.color = "#4CAF50";
            mediaInput.value = ''; 
            igLinkInput.value = '';
            loadGallery();
        } catch (error) {
            statusEl.innerText = `Error: ${error.message}`;
            statusEl.style.color = "red";
        } finally {
            uploadBtn.disabled = false;
        }
    });

    // ── GALLERY LOGIC ──
    async function loadGallery() {
        const { data, error } = await supabase.from('portfolio').select('*').order('created_at', { ascending: false });
        if (error) return;

        galleryEl.innerHTML = '';
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'media-item';
            
            const isVideo = item.type.includes('video') || item.type === 'reels_video';
            // Strip the IG link hash for the actual src preview
            const cleanUrl = item.url.split('#ig=')[0];

            div.innerHTML = isVideo ? `<video src="${cleanUrl}" autoplay loop muted></video>` : `<img src="${cleanUrl}">`;
            
            // Add a badge indicating where it is displayed
            const badge = document.createElement('div');
            badge.style = "position:absolute; bottom:5px; left:5px; background:rgba(0,0,0,0.8); padding:3px 8px; font-size:11px; color:#fff; border-radius:3px; text-transform:uppercase;";
            badge.innerText = item.type === 'reels_video' ? '🎬 Reels' : '📸 Portfolio';
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = 'Delete';
            delBtn.onclick = () => deleteMedia(item.id, cleanUrl);
            
            div.appendChild(badge);
            div.appendChild(delBtn);
            galleryEl.appendChild(div);
        });
    }

    async function deleteMedia(id, url) {
        if (!confirm('Are you sure you want to delete this?')) return;
        try {
            await supabase.from('portfolio').delete().eq('id', id);
            const fileName = url.split('/').pop();
            await supabase.storage.from('media').remove([fileName]);
            loadGallery();
        } catch(error) { alert("Error deleting media."); }
    }
</script>
</body>
</html>
